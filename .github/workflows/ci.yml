name: CI

on:
  workflow_call:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: OilTTY (.NET)
    permissions:
      contents: read
      checks: write
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/packages.lock.json

      - name: Restore
        run: dotnet restore OilTTY.slnx --locked-mode -maxcpucount:1 -nodeReuse:false

      - name: Build
        run: dotnet build OilTTY.slnx --configuration Release --no-restore -maxcpucount:1 -nodeReuse:false

      - name: Prepare test results directory
        run: mkdir -p TestResults

      - name: Test OilTTY
        run: dotnet OilTTY.Tests/bin/Release/net10.0/OilTTY.Tests.dll --results-directory TestResults --report-xunit-trx --report-xunit-trx-filename OilTTY.Tests.trx

      - name: Upload .NET test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dotnet-test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 3

      - name: Publish .NET test report
        # Fork and Dependabot runs have read-only tokens; their TRX files remain available above.
        if: >-
          always() &&
          github.actor != 'dependabot[bot]' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: .NET Tests
          path: TestResults/*.trx
          reporter: dotnet-trx
